<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><!-- figma:title --></title>
    <link rel="preload" href="/fonts/VK_Sans_Display-Medium.woff2" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/fonts/Arial-Regular.woff2" as="font" type="font/ttf" crossorigin />
    <!-- figma:head-end -->
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Static GitHub Pages (main branch) cannot run /src/main.tsx — fall back to built /docs -->
    <script>
      (function () {
        // Only when publishing the Vite source shell at the repo root (not /docs/* routes)
        if (/\/docs(\/|$)/i.test(location.pathname)) return
        var root = document.getElementById('root')
        var tries = 0
        var timer = setInterval(function () {
          tries += 1
          if (root && root.childNodes.length > 0) {
            clearInterval(timer)
            return
          }
          if (tries >= 8) {
            clearInterval(timer)
            var base = location.pathname.replace(/\/+$/, '')
            location.replace(base + '/docs/')
          }
        }, 250)
      })()
    </script>
    <!-- figma:body-end -->
  </body>
</html>
